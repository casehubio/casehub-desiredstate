<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520" font-family="Inter, -apple-system, system-ui, sans-serif" font-size="13">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#475569"/>
    </marker>
    <marker id="arrow-red" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="360" y="28" text-anchor="middle" font-size="16" font-weight="600" fill="#0f172a">Before vs After: The D9 Fix</text>

  <!-- BEFORE side -->
  <rect x="20" y="50" width="320" height="200" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="180" y="72" text-anchor="middle" font-size="14" font-weight="600" fill="#991b1b">Before — CRUD wrapper</text>

  <rect x="50" y="90" width="260" height="36" rx="6" fill="white" stroke="#e5e7eb"/>
  <text x="180" y="113" text-anchor="middle" font-weight="500" fill="#374151">GroupLifecycleService</text>

  <line x1="180" y1="126" x2="180" y2="152" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrow-red)"/>
  <text x="250" y="143" font-size="11" fill="#dc2626" font-style="italic">direct write</text>

  <rect x="50" y="155" width="260" height="36" rx="6" fill="white" stroke="#e5e7eb"/>
  <text x="180" y="178" text-anchor="middle" font-weight="500" fill="#374151">GroupInstanceStore</text>

  <text x="180" y="218" text-anchor="middle" font-size="11" fill="#991b1b">ReconciliationLoop never invoked</text>
  <text x="180" y="234" text-anchor="middle" font-size="11" fill="#991b1b">No desired graph. No fault recovery.</text>

  <!-- AFTER side -->
  <rect x="380" y="50" width="320" height="440" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <text x="540" y="72" text-anchor="middle" font-size="14" font-weight="600" fill="#166534">After — desired-state-first</text>

  <rect x="410" y="90" width="260" height="36" rx="6" fill="white" stroke="#e5e7eb"/>
  <text x="540" y="113" text-anchor="middle" font-weight="500" fill="#374151">GroupLifecycleService</text>

  <line x1="540" y1="126" x2="540" y2="152" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="610" y="143" font-size="11" fill="#475569">mutate</text>

  <rect x="410" y="155" width="260" height="36" rx="6" fill="#dbeafe" stroke="#93c5fd"/>
  <text x="540" y="178" text-anchor="middle" font-weight="500" fill="#1e40af">OrgGoal (intent store)</text>

  <line x1="540" y1="191" x2="540" y2="217" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="610" y="208" font-size="11" fill="#475569">compile</text>

  <rect x="410" y="220" width="260" height="36" rx="6" fill="#dbeafe" stroke="#93c5fd"/>
  <text x="540" y="243" text-anchor="middle" font-weight="500" fill="#1e40af">OrgGoalCompiler</text>

  <line x1="540" y1="256" x2="540" y2="282" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="610" y="273" font-size="11" fill="#475569">CAS swap</text>

  <rect x="410" y="285" width="260" height="36" rx="6" fill="#fef3c7" stroke="#fcd34d"/>
  <text x="540" y="308" text-anchor="middle" font-weight="500" fill="#92400e">ReconciliationLoop</text>

  <line x1="540" y1="321" x2="540" y2="347" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="610" y="338" font-size="11" fill="#475569">provision</text>

  <rect x="410" y="350" width="260" height="36" rx="6" fill="#fef3c7" stroke="#fcd34d"/>
  <text x="540" y="373" text-anchor="middle" font-weight="500" fill="#92400e">OrgNodeProvisioner</text>

  <line x1="540" y1="386" x2="540" y2="412" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="410" y="415" width="260" height="36" rx="6" fill="white" stroke="#e5e7eb"/>
  <text x="540" y="438" text-anchor="middle" font-weight="500" fill="#374151">GroupInstanceStore</text>

  <text x="540" y="475" text-anchor="middle" font-size="11" fill="#166534">Intent → Reconciliation → Actuation</text>
</svg>
